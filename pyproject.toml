[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tuvi-mcp-server"
version = "0.3.2"
description = "A Model Context Protocol (MCP) server for Vietnamese Tu Vi horoscope calculation and management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Manh Ha Nguyen", email = "manh.ha.3218@gmail.com"}
]
keywords = ["mcp", "tuvi", "horoscope", "astrology", "vietnamese", "lunar-calendar"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.27.2,<2.0.0",
    "pillow>=10.0.0",
] 

[project.urls]
Homepage = "https://github.com/nmhaaa3218/TuViMCP"
Repository = "https://github.com/nmhaaa3218/TuViMCP"
"Bug Tracker" = "https://github.com/nmhaaa3218/TuViMCP/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
tuvi-mcp = "tuvi_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tuvi_mcp*"]

# Ship non-code assets (declarative Cách Cục rule dataset, etc.) alongside
# the Python package so wheel installs carry them.
[tool.setuptools.package-data]
"tuvi_mcp._data" = ["*.json"]




[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "tuvi_mcp/ansaotuvi",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Package ``__init__`` modules re-export public symbols through ``__all__``;
# ruff flags the bare ``from .X import Y`` lines as unused (F401), which is
# the canonical Python re-export pattern.
"**/__init__.py" = ["F401"]



[tool.ruff.format]
quote-style = "double"
indent-style = "space"


