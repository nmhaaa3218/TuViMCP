[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tuvi-mcp-server"
version = "0.1.3"
description = "A Model Context Protocol (MCP) server for Vietnamese Tu Vi horoscope calculation and management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
tuvi-mcp = "tuvi_mcp.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tuvi_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "tuvi_mcp/ansaotuvi",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


